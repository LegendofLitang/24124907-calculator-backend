server:
  port: 8080

spring:
  application:
    name: calculator-system

  datasource:
    # H2 文件数据库：历史记录在应用重启后依然保留。
    # 选择文件库而非内存库的原因：计算历史是本系统的核心数据，
    # 使用 file 模式（./data/calculatordb）可以避免每次重启丢失全部历史。
    # 若希望每次启动都是全新数据，把 url 改为 jdbc:h2:mem:calculatordb 即可。
    url: jdbc:h2:file:./data/calculatordb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      # H2 控制台（浏览器访问 /h2-console，JDBC URL 见上）
      enabled: true
      path: /h2-console

logging:
  level:
    root: info
    com.example.calculator: debug
    org.hibernate: warn
